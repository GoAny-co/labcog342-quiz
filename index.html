:root{
  --desk:#ffc4d8; --desk2:#ffb3cd;
  --paper:#fff8fb; --rule:#ffd9e7; --margin:#ff9cbf;
  --ink:#45102f; --ink2:#7d3a5d;
  --pink:#ff4d8d; --pink2:#ff8db6; --pink3:#ffd0e1;
  --hl:#fff27a; --hl2:#ffe14a;
  --mint:#0f9b78; --mintbg:#c9f3e3;
  --lilac:#cdbcff; --peach:#ffc9a8; --sky:#bfe3ff;
  --serif:'Mitr','Sarabun',sans-serif; --hand:'Sarabun',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scrollbar-color:var(--pink2) var(--desk)}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{background:var(--pink2);border-radius:8px;border:3px solid var(--desk)}::-webkit-scrollbar-track{background:var(--desk)}
::selection{background:var(--hl2);color:var(--ink)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--hand);font-size:18px;line-height:1.6;
  background:var(--desk) radial-gradient(circle at 1px 1px,rgba(255,255,255,.55) 1.4px,transparent 1.6px) 0 0/22px 22px;
  overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.desk{max-width:1000px;margin:0 auto;padding:34px 18px 70px;position:relative}

/* ---- the sheet ---- */
.sheet{position:relative;background:
  linear-gradient(90deg,transparent 78px,var(--margin) 78px,var(--margin) 80px,transparent 80px),
  repeating-linear-gradient(180deg,transparent 0 35px,var(--rule) 35px 36px),var(--paper);
  border-radius:6px 22px 22px 6px;padding:54px 34px 38px 104px;
  box-shadow:0 1px 0 #fff inset,0 2px 3px rgba(80,10,45,.12),0 22px 40px -12px rgba(80,10,45,.35);}
.sheet::before{ /* spiral holes */
  content:"";position:absolute;left:18px;top:34px;bottom:34px;width:26px;
  background:radial-gradient(circle at 13px 13px,var(--desk2) 0 8px,rgba(80,10,45,.28) 8.5px 10px,transparent 10.5px) 0 0/26px 56px repeat-y;}
.tape{position:absolute;top:-16px;left:50%;width:190px;height:34px;margin-left:-95px;rotate:-2deg;
  background:repeating-linear-gradient(115deg,rgba(255,77,141,.78) 0 12px,rgba(255,255,255,.72) 12px 24px);
  box-shadow:0 2px 4px rgba(80,10,45,.18);border-radius:2px;}

/* ---- header ---- */
.top{display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:end;min-height:190px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,9vw,92px);line-height:1.02;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
h1 .w>span{display:inline-block}
.hl{position:relative;z-index:0;white-space:nowrap}
.hl::before{content:"";position:absolute;z-index:-1;left:-.08em;right:-.08em;top:48%;bottom:2%;background:var(--hl);border-radius:.15em .5em .2em .45em;transform-origin:left;rotate:-1.2deg}
.sub{margin:12px 0 0;font-size:19px;color:var(--ink2);max-width:36ch}
.sub b{color:var(--ink)}
.side{position:relative;width:min(190px,34vw);justify-self:end}
.cap{width:100%;height:auto;display:block;overflow:visible}
.sticker{position:absolute;left:-26px;top:-10px;width:92px;height:92px;border-radius:50%;background:var(--hl);color:var(--ink);display:grid;place-content:center;text-align:center;line-height:1.05;rotate:-12deg;box-shadow:0 6px 12px -3px rgba(80,10,45,.4);border:3px dashed var(--pink);outline:6px solid var(--hl)}
.sticker b{font-family:var(--serif);font-weight:400;font-size:34px}
.sticker small{font-size:12px;font-weight:600}

/* ---- stamp card ---- */
.card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 8px}
.card .lbl{font-weight:700;font-size:15px;color:var(--ink2)}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px dashed var(--margin);display:grid;place-items:center;background:var(--paper)}
.dot svg{width:14px;height:14px;opacity:0}
.dot.on{border:2px solid var(--mint);background:var(--mintbg)}
.dot.on svg{opacity:1}
.nextbtn{margin-left:auto}

/* ---- buttons ---- */
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:14px;padding:11px 20px;font-weight:700;box-shadow:0 8px 14px -6px rgba(69,16,47,.55);transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 18px -6px rgba(69,16,47,.55);background:#5d1741}
.btn:active{transform:translateY(1px);box-shadow:0 3px 6px -2px rgba(69,16,47,.5)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--pink3)}
.btn.sm{padding:7px 14px;font-size:15px}

/* ---- chapter rows ---- */
.rows{margin-top:10px}
.row{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 22px;padding:14px 0 16px;border-bottom:2px dotted var(--margin)}
.row:last-child{border-bottom:0}
.tab{position:absolute;left:-104px;top:16px;width:86px;height:46px;border-radius:12px 0 0 12px;display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:var(--ink);box-shadow:-3px 4px 8px -3px rgba(80,10,45,.3);transition:transform .35s var(--ease)}
.tab small{font-family:var(--hand);font-size:11px;font-weight:700;display:block;line-height:1;margin-top:-2px;text-align:center}
.row:hover .tab{transform:translateX(-10px)}
.row h2{font-family:var(--serif);font-weight:400;font-size:clamp(21px,3.4vw,28px);line-height:1.25;margin:0}
.row .s{margin:2px 0 6px;color:var(--ink2);font-size:15px;line-height:1.45}
.who{display:inline;font-size:14.5px;font-weight:600;background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%);padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pts{font-size:14px;color:var(--ink2);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.star{width:18px;height:18px;flex:none}
.pstar{display:inline-flex;align-items:center;gap:4px;background:var(--hl);border-radius:999px;padding:0 10px 0 6px;font-weight:700;font-size:13px}
.sets{display:flex;gap:12px;align-items:flex-start;padding-top:2px}
.note{position:relative;width:96px;height:96px;border:0;padding:10px 8px;text-align:left;font-weight:700;font-size:15px;line-height:1.25;color:var(--ink);border-radius:3px 3px 3px 16px;box-shadow:0 10px 14px -8px rgba(80,10,45,.45),0 1px 2px rgba(80,10,45,.2);transition:transform .35s var(--ease),box-shadow .35s var(--ease);background:var(--c,#ffe27a);rotate:var(--r,-2deg)}
.note:nth-child(1){--c:#ffe9a3;--r:-2.5deg}.note:nth-child(2){--c:#ffc2da;--r:1.8deg}.note:nth-child(3){--c:#d5c8ff;--r:-1deg}
.note::after{content:"";position:absolute;right:0;bottom:0;width:20px;height:20px;background:linear-gradient(135deg,transparent 50%,rgba(80,10,45,.14) 50%);border-radius:0 0 0 12px}
.note:hover{transform:translateY(-6px) rotate(0);box-shadow:0 18px 20px -10px rgba(80,10,45,.5)}
.note big{display:block;font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.1}
.note span{display:block;font-weight:600;font-size:12.5px;color:var(--ink2);margin-top:4px}
.note.prog span{color:var(--ink);text-decoration:underline wavy var(--pink)}
.note.done{filter:saturate(.7)}
.stampmark{position:absolute;right:-10px;top:-12px;rotate:-12deg;border:3px solid var(--mint);color:var(--mint);border-radius:10px;padding:0 7px;font-family:var(--serif);font-size:15px;line-height:1.35;background:rgba(201,243,227,.55);mix-blend-mode:multiply;pointer-events:none}
.row .note.done:hover{filter:none}

.foot{margin-top:26px;font-size:14px;color:var(--ink2);display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ---- quiz screen ---- */
.hidden{display:none!important}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.qhead .t{font-family:var(--serif);font-size:clamp(20px,3.2vw,26px);line-height:1.2}
.qmeta{font-size:14px;color:var(--ink2);margin:2px 0 0}
.qdots{display:flex;gap:7px;margin:20px 0 6px;flex-wrap:wrap}
.qd{width:26px;height:26px;border-radius:50%;border:2px dashed var(--margin);background:var(--paper);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .4s var(--ease)}
.qd svg{width:15px;height:15px;opacity:0}
.qd.on{background:var(--mintbg);border:2px solid var(--mint);transform:scale(1.08)}
.qd.on svg{opacity:1}
.left{font-size:14.5px;color:var(--ink2)}
.qbody{margin-top:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;min-height:28px}
.chip{font-size:13.5px;font-weight:700;background:var(--pink3);border-radius:999px;padding:1px 12px;display:inline-flex;align-items:center;gap:5px}
.chip.retry{background:var(--ink);color:var(--paper)}
.chip.st{background:var(--hl)}
.qt{font-weight:700;font-size:clamp(20px,3.6vw,26px);line-height:1.5;margin:6px 0 20px;text-wrap:balance}
.opts{display:grid;gap:12px}
.opt{position:relative;overflow:hidden;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:11px 16px 11px 12px;font-size:18px;line-height:1.5;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.opt>*{position:relative;z-index:1}
.opt::before{content:"";position:absolute;z-index:0;inset:0;background:var(--hl);transform:scaleX(0);transform-origin:left}
.opt:hover:not(:disabled){transform:translateX(6px);box-shadow:0 8px 14px -8px rgba(80,10,45,.5)}
.bub{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--serif);font-size:19px;background:var(--pink3)}
.bub svg{display:none;width:24px;height:24px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--mint)}
.opt.ok::before{background:var(--hl);animation:sweep .55s var(--ease) forwards}
.opt.ok .bub{background:var(--mintbg);border-color:var(--mint)}
.opt.ok .bub b{display:none}.opt.ok .bub svg{display:block}
.opt.ok .bub svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .2s var(--ease) forwards}
.opt.bad{border-color:var(--pink);animation:shake .5s var(--ease)}
.opt.bad::before{background:#ffc3d8;animation:sweep .45s var(--ease) forwards}
.opt.bad .bub{background:var(--pink);color:var(--ink);border-color:var(--ink)}
.opt.bad{text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:2px}
.opt.dim{opacity:.55}
.exp{margin:22px 0 0;position:relative;rotate:-.8deg;background:var(--hl);padding:18px 20px 16px;border-radius:3px 3px 3px 22px;box-shadow:0 14px 18px -10px rgba(80,10,45,.5);display:none}
.exp.show{display:block;animation:pop .55s var(--ease)}
.exp.bad{background:#ffd0e1}
.exp h4{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 4px}
.exp p{margin:3px 0}
.exp::before{content:"";position:absolute;top:-12px;left:30px;width:74px;height:24px;background:repeating-linear-gradient(115deg,rgba(255,77,141,.8) 0 9px,rgba(255,255,255,.75) 9px 18px);rotate:-4deg;opacity:.9}
.actions{margin-top:20px;display:flex;justify-content:flex-end}

/* ---- finish ---- */
.fin{text-align:center;padding:10px 0 4px}
.fin h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);margin:6px 0}
.bigstamp{display:inline-block;rotate:-9deg;border:5px solid var(--mint);color:var(--mint);border-radius:18px;padding:2px 24px;font-family:var(--serif);font-size:clamp(34px,7vw,56px);line-height:1.4;margin:14px 0;background:rgba(201,243,227,.5);animation:thump .7s .15s var(--ease) backwards}
.fin .mas{width:150px;margin:0 auto}

/* ---- capsule character ---- */
.eyes-h,.eyes-o,.sweat{display:none}
.cap.happy .eyes-n{display:none}.cap.happy .eyes-h{display:block}
.cap.oops .eyes-n{display:none}.cap.oops .eyes-o{display:block}.cap.oops .sweat{display:block}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bob{animation:bob 3.4s ease-in-out infinite;transform-origin:50% 90%}

/* ---- motion ---- */
@keyframes sweep{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:8px}60%{translate:-5px}80%{translate:3px}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes thump{0%{opacity:0;scale:2.6;rotate:6deg}55%{opacity:1;scale:.92;rotate:-11deg}75%{scale:1.05}100%{scale:1}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(-5deg) scale(.94)}55%{opacity:1;transform:translateY(10px) rotate(1deg) scale(1)}78%{transform:translateY(-4px) rotate(-.3deg)}100%{transform:none}}
@keyframes slap{from{transform:scaleX(0)}}
@keyframes rise{from{transform:translateY(105%)}}
@keyframes swipe{from{transform:scaleX(0)}}
@keyframes sticker{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:none}}
@keyframes roll{0%{transform:translateX(150%) rotate(220deg)}70%{transform:translateX(-6%) rotate(-8deg)}100%{transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-34px)}}
@keyframes note{from{opacity:0;transform:translateY(24px) rotate(10deg) scale(.8)}}
@keyframes dotpop{from{transform:scale(0)}60%{transform:scale(1.35)}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}

.go .sheet{animation:drop 1s var(--ease) backwards}
.go .tape{animation:slap .5s .55s var(--ease) backwards;transform-origin:left}
.go h1 .w>span{animation:rise .8s var(--ease) backwards}
.go h1 .w:nth-child(1)>span{animation-delay:.45s}.go h1 .w:nth-child(2)>span{animation-delay:.55s}.go h1 .w:nth-child(3)>span{animation-delay:.65s}.go h1 .w:nth-child(4)>span{animation-delay:.75s}
.go .hl::before{animation:swipe .7s 1.05s var(--ease) backwards}
.go .sub{animation:fadeup .7s 1s var(--ease) backwards}
.go .sticker{animation:sticker .7s 1.2s var(--ease) backwards}
.go .side .cap{animation:roll 1s .7s var(--ease) backwards}
.go .card{animation:fadeup .6s 1.1s var(--ease) backwards}
.go .dot{animation:dotpop .35s backwards}
.go .row{animation:slidein .7s var(--ease) backwards;animation-delay:calc(1s + var(--i)*.08s)}
.go .row .note{animation:note .6s var(--ease) backwards;animation-delay:calc(1.15s + var(--i)*.08s + var(--j)*.07s)}
.play-in{animation:drop .7s var(--ease) backwards}
.qanim{animation:fadeup .45s var(--ease) backwards}
.qanim .opt{animation:slidein .5s var(--ease) backwards}
.qanim .opt:nth-child(1){animation-delay:.05s}.qanim .opt:nth-child(2){animation-delay:.11s}.qanim .opt:nth-child(3){animation-delay:.17s}.qanim .opt:nth-child(4){animation-delay:.23s}

@media (max-width:700px){
  body{font-size:16px}
  .desk{padding:20px 10px 50px}
  .sheet{padding:44px 16px 28px 44px;background:
    linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),
    repeating-linear-gradient(180deg,transparent 0 35px,var(--rule) 35px 36px),var(--paper)}
  .sheet::before{display:none}
  .top{grid-template-columns:1fr 92px;min-height:0;align-items:start}
  h1{font-size:clamp(40px,12.5vw,58px)}
  .side{width:92px;margin-top:-6px}
  .sticker{width:64px;height:64px;left:-40px;top:96px;outline-width:4px}.sticker b{font-size:24px}.sticker small{font-size:10.5px}
  .sub{grid-column:1/-1}
  .row{grid-template-columns:1fr}
  .tab{position:static;width:auto;height:auto;border-radius:10px;display:inline-flex;gap:8px;padding:2px 12px;font-size:20px;margin-bottom:4px;justify-self:start;align-items:center}
  .tab small{display:inline;margin:0}
  .row:hover .tab{transform:none}
  .sets{gap:8px}.note{width:calc((100% - 16px)/3);min-width:0;height:90px}
  .opt{font-size:16.5px}
}
.sticker[hidden]{display:none}
/* ---- iPad ---- */
@media (min-width:701px) and (max-width:1400px){
  .desk{max-width:1200px;padding:28px 22px 48px}
  .sheet{padding:42px 30px 30px 100px}
  .tab{left:-100px;height:58px;line-height:1.1;align-content:center}
  .top{min-height:0;align-items:center}
  h1{font-size:clamp(50px,7vw,76px);white-space:nowrap}
  .side{width:120px}
  .sticker{width:78px;height:78px;left:-52px}.sticker b{font-size:27px}.sticker small{font-size:10.5px}
  .sub{max-width:none}
  .card{margin:16px 0 4px}
  .row h2{font-size:22px}
  .sets{gap:10px}.note{width:92px;height:92px}
  .btn.sm{min-height:44px}
  .opt{min-height:64px}
}
@media (min-width:980px) and (max-width:1400px){
  .opts{grid-template-columns:1fr 1fr}
  .note{width:108px;height:96px}
}
@media (min-width:701px) and (max-width:860px){.row h2{font-size:19.5px}.row{column-gap:14px}.sets{gap:8px}.note{width:84px;height:88px;font-size:14px}.note big{font-size:22px}.dots{gap:5px}.dot{width:20px;height:20px}.card{gap:10px}}
@media (hover:none){
  .note:hover,.row:hover .tab,.opt:hover:not(:disabled),.btn:hover{transform:none}
}
button{touch-action:manipulation}

/* ---- landscape: an open ring binder, two pages ---- */
.mas2{display:none}
.leaf{display:none}
@media (orientation:landscape) and (min-width:900px){
  .desk{max-width:1300px;min-height:100vh;min-height:100dvh;padding:22px calc(70px + env(safe-area-inset-right)) 26px calc(30px + env(safe-area-inset-left));display:grid;perspective:2200px}
  main,section{display:grid;min-width:0}
  main>*{grid-area:1/1}
  .sheet{min-height:100%;padding:0;border-radius:16px;display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);
    background:linear-gradient(90deg,transparent calc(44% - 46px),rgba(120,20,70,.13) 44%,transparent calc(44% + 46px)),
      repeating-linear-gradient(180deg,transparent 0 35px,var(--rule) 35px 36px),var(--paper)}
  .sheet::before{left:44%;top:26px;bottom:26px;width:64px;margin-left:-32px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2246%22%3E%3Ccircle%20cx%3D%2211%22%20cy%3D%2224%22%20r%3D%226%22%20fill%3D%22%23e58fb0%22/%3E%3Ccircle%20cx%3D%2253%22%20cy%3D%2224%22%20r%3D%226%22%20fill%3D%22%23e58fb0%22/%3E%3Cpath%20d%3D%22M11%2023C15%207%2049%207%2053%2023%22%20fill%3D%22none%22%20stroke%3D%22%238d3a62%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M14%2018C20%2010%2044%2010%2050%2018%22%20fill%3D%22none%22%20stroke%3D%22%23f7d3e1%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E") 0 0/64px 46px round;background-repeat:no-repeat;background-repeat:round;z-index:3;pointer-events:none}
  .tape{display:none}

  /* contents page */
  #sheet{grid-template-rows:auto auto 1fr}
  .top{grid-column:1;grid-row:1;display:block;padding:38px 56px 0 40px;position:relative}
  h1{font-size:clamp(58px,6.6vw,86px);white-space:normal;line-height:1.08;max-width:5.2em}
  .sub{font-size:17px;margin-top:14px;max-width:26ch}
  .side{position:absolute;right:54px;bottom:-34px;width:clamp(96px,10vw,132px)}
  .sticker{left:-64px;top:6px}
  .card{grid-column:1;grid-row:2;margin:34px 56px 0 40px;display:grid;grid-template-columns:auto 1fr;gap:12px 18px}
  .dots{grid-column:1/-1;display:grid;grid-template-columns:repeat(15,minmax(0,24px));gap:5px}
  .dot{width:auto;height:auto;aspect-ratio:1}
  .nextbtn{margin:8px 0 0;grid-column:1/-1;justify-self:start;font-size:19px!important;padding:12px 26px!important}
  .foot{grid-column:1;grid-row:3;align-self:end;margin:22px 60px 26px 40px;font-size:13.5px}
  .rows{grid-column:2;grid-row:1/4;margin:0;padding:22px 34px 18px 58px;display:grid;grid-auto-rows:auto;align-content:space-between}
  .row{padding:9px 0 10px;grid-template-columns:minmax(0,1fr) auto;gap:0 16px;grid-template-rows:auto auto auto 1fr}
  .row>div:nth-child(2){display:contents}
  .row h2{grid-column:1/-1}
  .row .s{grid-column:1/-1}
  .row .who,.row .pts{grid-column:1;justify-self:start}
  .row .who{background:none;padding:0}
  .row .sets{grid-column:2;grid-row:3/5;align-self:center;padding:4px 0 0}
  .tab{left:auto;right:-82px;top:50%;translate:0 -50%;width:52px;height:74%;border-radius:0 14px 14px 0;box-shadow:4px 4px 8px -4px rgba(80,10,45,.35);font-size:25px}
  .row:hover .tab{transform:none}
  .row h2{font-size:clamp(18px,1.75vw,22px);text-wrap:balance}
  .row .s{font-size:13.5px;margin:0 0 2px;line-height:1.35}
  .who{font-size:12.5px;line-height:1.45}.pts{font-size:12.5px;margin-top:1px}.pstar{font-size:12px}
  .sets{gap:8px}.note{width:clamp(70px,6.8vw,86px);height:clamp(66px,5.9vw,76px);padding:6px 7px;font-size:13px}
  .note big{font-size:clamp(18px,1.9vw,22px)}.note span{font-size:11.5px;margin-top:2px}

  /* question page | answer page */
  #psheet{grid-template-rows:auto auto auto 1fr auto}
  .qhead{grid-area:1/1;padding:32px 56px 0 40px;flex-wrap:nowrap}
  .qhead .btn{flex:none}
  .qdots{grid-area:2/1;margin:18px 56px 4px 40px;gap:6px}
  .left{grid-area:3/1;margin:0 56px 0 40px}
  .qbody{display:contents}
  .ql{grid-area:4/1;align-self:center;padding:16px 58px 12px 40px}
  .qt{font-size:clamp(23px,2.35vw,31px);line-height:1.5;margin:8px 0 0}
  .mas2{display:block;grid-area:5/1;width:96px;margin:0 0 20px 40px}
  .qr{grid-area:1/2/6/3;align-self:center;padding:30px 38px 28px 62px;min-width:0}
  .opts{grid-template-columns:1fr;gap:11px}
  .opt{min-height:62px}
  .exp{margin-top:24px;padding:15px 20px 13px}
  .exp h4{font-size:20px}
  .fin{grid-area:1/2/6/3;align-self:center;padding:30px 38px 30px 62px}

  /* turning sheet of paper */
  .leaf{display:block;position:absolute;z-index:4;left:44%;top:0;bottom:0;width:56%;transform-origin:left;transform-style:preserve-3d;pointer-events:none;animation:turn .78s cubic-bezier(.45,.05,.2,1) forwards}

<script>
const KEY='labcog342_v2';
let S={done:{},prog:null};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const SETS=3, TH=['ก','ข','ค','ง'];
const TABS=['#ff9fc1','#cdbcff','#ffc9a8','#bfe3ff','#ffe27a','#a8e6cf','#ffb3d6'];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chOf=id=>CH.find(c=>c.id==id);
const key=(c,s)=>c+'-'+(s+1);
const clean=t=>t.replace(/⭐/g,'').replace(/\s+·\s*$/,'').trim();
const hasStar=c=>/⭐/.test(c.teacher+c.sub);
const STAR='<svg class="star" aria-hidden="true"><use href="#star"/></svg>';
const TICK='<svg aria-hidden="true"><use href="#tick"/></svg>';
// inlined because .cap.happy/.oops selectors cannot reach into <use> shadow trees
for(const id of ['mas','mas2'])$(id).innerHTML=$('capsule').innerHTML;
function mood(m){$('mas').setAttribute('class','cap'+(m?' '+m:''));$('mas2').setAttribute('class','cap mas2'+(m?' '+m:''))}
const still=matchMedia('(prefers-reduced-motion:reduce)'),wide=matchMedia('(orientation:landscape) and (min-width:900px)');
function leaf(sheet,kind){
  if(still.matches||!wide.matches)return;
  sheet.querySelectorAll('.leaf').forEach(x=>x.remove());
  const l=document.createElement('div');l.className='leaf '+(kind||'');l.setAttribute('aria-hidden','true');
  l.innerHTML=kind==='cover'?'<i><b>สมุดควิซ<br>Lab Cog 342</b></i><i></i>':'<i></i><i></i>';
  sheet.appendChild(l);
  const end=()=>l.remove();l.addEventListener('animationend',end);setTimeout(end,2000);
}

/* countdown to 19 Nov 2026 */
(function(){
  const d=new Date(2026,10,19),n=new Date();n.setHours(0,0,0,0);
  const k=Math.round((d-n)/86400000);
  const el=$('count');
  if(k>0){$('cd').textContent=k;$('cdt').textContent='วันก่อนสอบ';el.hidden=false}
  else if(k===0||k===-1){$('cd').textContent='วันนี้';$('cd').style.fontSize='26px';$('cdt').textContent='สอบแล้ว!';el.hidden=false}
})();

function home(){
  $('play').classList.add('hidden');$('home').classList.remove('hidden');
  const g=$('rows');g.innerHTML='';let nd=0;const dots=$('dots');dots.innerHTML='';
  CH.forEach((c,i)=>{
    const el=document.createElement('article');el.className='row';el.style.setProperty('--i',i);
    let btns='';
    for(let s=0;s<SETS;s++){
      const k=key(c.id,s),d=S.done[k],pr=S.prog&&S.prog.k===k;
      if(d)nd++;
      btns+=`<button class="note ${d?'done':''} ${pr&&!d?'prog':''}" style="--j:${s}" data-c="${c.id}" data-s="${s}" aria-label="บท ${c.id} ชุด ${s+1} ${d?'ทำแล้ว':pr?'ทำค้างอยู่':'ยังไม่ทำ'}"><big>ชุด ${s+1}</big><span>${d?'พลาด '+d.mistakes+' ครั้ง':(pr?'ทำค้างอยู่':'ยังไม่ทำ')}</span>${d?'<i class="stampmark">ทำแล้ว</i>':''}</button>`;
    }
    const tc=TABS[i%TABS.length];
    el.innerHTML=`<div class="tab" style="background:${tc}">${c.id}<small>บท</small></div>
    <div><h2>${c.title}</h2><p class="s">${clean(c.sub)}</p><span class="who">${clean(c.teacher)}</span>
    <div class="pts">${c.pts}${hasStar(c)?`<span class="pstar">${STAR}ของอาจารย์ปิยนุช</span>`:''}</div></div>
    <div class="sets">${btns}</div>`;
    g.appendChild(el);
  });
  CH.forEach(c=>{for(let s=0;s<SETS;s++){const on=!!S.done[key(c.id,s)];const d=document.createElement('span');d.className='dot'+(on?' on':'');d.style.animationDelay=(1.2+dots.children.length*.03)+'s';d.innerHTML=TICK;dots.appendChild(d)}});
  $('s-sets').textContent=`ตราปั๊มสะสม ${nd}/${CH.length*SETS}`;
  $('nextAny').textContent=nd===CH.length*SETS?'ทำครบแล้ว':(S.prog?'ทำต่อชุดที่ค้าง':'เริ่มชุดถัดไป');
  g.querySelectorAll('.note').forEach(b=>b.onclick=()=>{
    const c=+b.dataset.c,s=+b.dataset.s,k=key(c,s);
    start(c,s,!!S.done[k]);
  });
  mood('');
}

let cur=null;
function start(c,s,review){
  const k=key(c,s);
  if(!review&&S.prog&&S.prog.k===k&&S.prog.queue.length){cur=S.prog;cur.review=false}
  else{
    cur={k,c,s,queue:sh([...Array(10).keys()].map(i=>s*10+i)),total:10,mistakes:0,wrong:{},review:!!review};
    if(!review){S.prog=cur;save()}
  }
  $('home').classList.add('hidden');$('play').classList.remove('hidden');
  const ps=$('psheet');ps.classList.remove('play-in');void ps.offsetWidth;ps.classList.add('play-in');
  $('fin').classList.add('hidden');$('qbody').classList.remove('hidden');
  scrollTo({top:0});
  show();
}

function qdots(){
  const live=new Set(cur.queue);const box=$('qdots');box.innerHTML='';
  for(let i=0;i<10;i++){const q=cur.s*10+i;const d=document.createElement('span');d.className='qd'+(live.has(q)?'':' on');d.innerHTML=TICK;box.appendChild(d)}
}

function show(){
  const ch=chOf(cur.c);
  if(!cur.queue.length)return finish();
  const qi=cur.queue[0],q=ch.q[qi];
  const opts=sh([q[1],q[2],q[3],q[4]]);
  $('ptitle').textContent=`บท ${ch.id} · ชุด ${cur.s+1}${cur.review?' (ทบทวน)':''}`;
  $('pmeta').textContent=ch.title+' · '+clean(ch.teacher).split('·')[0].trim();
  $('pcount').textContent=`เหลืออีก ${cur.queue.length} ข้อ`+(cur.mistakes?` · พลาดไปแล้ว ${cur.mistakes} ครั้ง`:'');
  qdots();
  let t='';
  if(q[6])t+=`<span class="chip st">${STAR}เน้นออกสอบ</span>`;
  if(cur.wrong[qi])t+=`<span class="chip retry">ข้อที่เคยพลาด · ลองใหม่</span>`;
  $('tags').innerHTML=t;
  $('qtext').textContent=q[0];
  const o=$('opts');o.innerHTML='';
  opts.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="bub"><b>${TH[i]}</b>${TICK}</span><span></span>`;b.lastChild.textContent=x;b.onclick=()=>pick(b,x,q,qi);o.appendChild(b)});
  const e=$('exp');e.className='exp';e.innerHTML='';
  $('nextq').classList.add('hidden');
  leaf($('psheet'));scrollTo({top:0});
  const qb=$('qbody');qb.classList.remove('qanim');void qb.offsetWidth;qb.classList.add('qanim');
  mood('');
}

function pick(btn,val,q,qi){
  const ok=val===q[1];
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const txt=b.lastChild.textContent;
    if(txt===q[1])b.classList.add('ok'); else if(b!==btn)b.classList.add('dim');
  });
  if(!ok)btn.classList.add('bad');
  const e=$('exp');e.className='exp show '+(ok?'ok':'bad');
  e.innerHTML=`<h4>${ok?'ถูกต้อง!':'ยังไม่ถูก — เดี๋ยวข้อนี้วนมาให้ลองใหม่'}</h4><p>เฉลย: <b></b></p><p></p>`;
  e.querySelector('b').textContent=q[1];e.lastChild.textContent=q[5];
  cur.queue.shift();
  if(!ok){cur.mistakes++;cur.wrong[qi]=1;cur.queue.push(qi)}
  if(!cur.review){S.prog=cur;save()}
  qdots();
  $('pcount').textContent=`เหลืออีก ${cur.queue.length} ข้อ`+(cur.mistakes?` · พลาดไปแล้ว ${cur.mistakes} ครั้ง`:'');
  const n=$('nextq');n.classList.remove('hidden');n.textContent=cur.queue.length?'ข้อต่อไป':'ดูผลสรุป';n.focus({preventScroll:true});
  mood(ok?'happy':'oops');
}

function finish(){
  $('qbody').classList.add('hidden');
  leaf($('psheet'));mood('happy');
  const f=$('fin');f.classList.remove('hidden');
  if(!cur.review){S.done[cur.k]={mistakes:cur.mistakes,at:Date.now()};S.prog=null;save()}
  const left=[];CH.forEach(c=>{for(let s=0;s<SETS;s++)if(!S.done[key(c.id,s)])left.push([c.id,s])});
  const dn=CH.length*SETS-left.length;
  qdots();$('pcount').textContent='';
  f.innerHTML=`<svg class="cap mas happy" style="width:150px;display:block;margin:0 auto" viewBox="0 0 140 160">${$('capsule').innerHTML}</svg>
  <div class="bigstamp">ครบชุด!</div>
  <h2>บท ${cur.c} ชุด ${cur.s+1}</h2>
  <p>ตอบพลาด <b>${cur.mistakes}</b> ครั้ง และทุกข้อตอบถูกครบแล้ว · ตราปั๊มสะสม ${dn}/${CH.length*SETS}</p>
  <p class="qmeta">${cur.review?'โหมดทบทวน ไม่นับเป็นชุดใหม่':'บันทึกว่าทำแล้ว จะไม่ถูกสุ่มซ้ำ'}</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">
   ${left.length?'<button class="btn" id="nx">ชุดถัดไปที่ยังไม่ทำ</button>':'<b>ทำครบทุกชุดแล้ว!</b>'}
   <button class="btn ghost" id="hm">กลับสมุด</button></div>`;
  if(left.length)$('nx').onclick=()=>start(left[0][0],left[0][1],false);
  $('hm').onclick=goHome;
}

function goHome(){const d=$('desk');d.classList.remove('go');void d.offsetWidth;d.classList.add('go','quick');home();leaf($('sheet'),'back');scrollTo({top:0})}
$('nextq').onclick=show;
$('back').onclick=goHome;
$('nextAny').onclick=()=>{
  if(S.prog)return start(S.prog.c,S.prog.s,false);
  for(const c of CH)for(let s=0;s<SETS;s++)if(!S.done[key(c.id,s)])return start(c.id,s,false);
  $('nextAny').textContent='ทำครบทุกชุดแล้ว';
};
let rc=0;$('reset').onclick=()=>{const b=$('reset');if(!rc){rc=1;b.textContent='กดอีกครั้งเพื่อยืนยันล้างทั้งหมด';setTimeout(()=>{rc=0;b.textContent='ล้างความคืบหน้า'},3500);return}rc=0;b.textContent='ล้างความคืบหน้า';S={done:{},prog:null};save();goHome()};
document.addEventListener('keydown',e=>{
  if($('play').classList.contains('hidden'))return;
  const n=$('nextq');
  if((e.key==='Enter'||e.key===' ')&&!n.classList.contains('hidden')&&document.activeElement!==n){e.preventDefault();n.click();return}
  const i='1234'.indexOf(e.key);
  if(i>-1){const b=document.querySelectorAll('.opt')[i];if(b&&!b.disabled)b.click()}
});
